<svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#161B22" stroke-width="1"/></pattern>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#6E7681"/></marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#F85149"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#3FB950"/></marker>
    <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#A371F7"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#0D1117"/><rect width="1200" height="520" fill="url(#g)"/>
  <text x="44" y="40" fill="#E6EDF3" font-size="22" font-weight="700">Preference data: computed from votes, then audited, adjudicated, bound to a reward model</text>

  <!-- votes -> derive -> pairs -->
  <rect x="44" y="74" width="150" height="76" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.4"/>
  <text x="119" y="100" fill="#E6EDF3" font-size="12.5" text-anchor="middle" font-weight="700">raw votes</text>
  <text x="119" y="121" fill="#79C0FF" font-size="12" text-anchor="middle" font-weight="700">63,000</text>
  <text x="119" y="139" fill="#6E7681" font-size="10" text-anchor="middle">3 annotators / pair</text>

  <line x1="196" y1="112" x2="242" y2="112" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="219" y="103" fill="#9DA7B3" font-size="9" text-anchor="middle">majority</text>

  <rect x="246" y="74" width="150" height="76" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.4"/>
  <text x="321" y="100" fill="#E6EDF3" font-size="12.5" text-anchor="middle" font-weight="700">preference pairs</text>
  <text x="321" y="121" fill="#79C0FF" font-size="12" text-anchor="middle" font-weight="700">21,000</text>
  <text x="321" y="139" fill="#6E7681" font-size="10" text-anchor="middle">chosen / rejected</text>

  <text x="440" y="96" fill="#A371F7" font-size="11" font-weight="700">agreement distribution</text>
  <text x="440" y="115" fill="#9DA7B3" font-size="10.5">1.000 → 15,000　0.667 → 4,000</text>
  <text x="440" y="133" fill="#9DA7B3" font-size="10.5">0.333 → 2,000 (three people, three answers)</text>

  <!-- cycle illustration -->
  <g transform="translate(880,60)">
    <text x="110" y="20" fill="#F85149" font-size="12" text-anchor="middle" font-weight="700">preference cycle: impossible</text>
    <circle cx="60"  cy="52" r="16" fill="#161B22" stroke="#30363D"/><text x="60"  y="57" fill="#E6EDF3" font-size="12" text-anchor="middle">A</text>
    <circle cx="160" cy="52" r="16" fill="#161B22" stroke="#30363D"/><text x="160" y="57" fill="#E6EDF3" font-size="12" text-anchor="middle">B</text>
    <circle cx="110" cy="112" r="16" fill="#161B22" stroke="#30363D"/><text x="110" y="117" fill="#E6EDF3" font-size="12" text-anchor="middle">C</text>
    <line x1="78"  y1="52" x2="142" y2="52"  stroke="#F85149" stroke-width="1.6" marker-end="url(#arrR)"/>
    <line x1="153" y1="66" x2="120" y2="98"  stroke="#F85149" stroke-width="1.6" marker-end="url(#arrR)"/>
    <line x1="100" y1="98" x2="67"  y2="66"  stroke="#F85149" stroke-width="1.6" marker-end="url(#arrR)"/>
    <text x="110" y="145" fill="#F85149" font-size="11" text-anchor="middle" font-weight="700">630 pairs caught in cycles</text>
  </g>

  <!-- audit band -->
  <rect x="44" y="176" width="800" height="86" rx="10" fill="#0F1622" stroke="#21262D" stroke-width="1.2"/>
  <text x="60" y="196" fill="#9DA7B3" font-size="11.5" font-weight="700">audit on a branch (the pool's 21,000 pairs never move)</text>
  <g font-size="10.5" text-anchor="middle">
    <text x="135" y="222" fill="#E6EDF3" font-weight="700">degenerate</text><text x="135" y="242" fill="#F0883E" font-weight="700">drop 200</text>
    <text x="300" y="222" fill="#E6EDF3" font-weight="700">no consensus</text><text x="300" y="242" fill="#F0883E" font-weight="700">drop 2,000</text>
    <text x="465" y="222" fill="#E6EDF3" font-weight="700">cycles</text><text x="465" y="242" fill="#F0883E" font-weight="700">drop 630</text>
    <text x="680" y="222" fill="#E6EDF3" font-weight="700">length-bias audit</text>
    <text x="680" y="242" fill="#F85149" font-weight="700">75.9% chosen longer (look, don't delete)</text>
  </g>
  <g stroke="#30363D" stroke-width="1">
    <line x1="217" y1="208" x2="217" y2="252"/><line x1="382" y1="208" x2="382" y2="252"/><line x1="560" y1="208" x2="560" y2="252"/>
  </g>
  <line x1="321" y1="150" x2="321" y2="174" stroke="#A371F7" stroke-width="1.6" marker-end="url(#arrP)"/>

  <!-- audit record -->
  <rect x="44" y="286" width="800" height="52" rx="10" fill="#10231A" stroke="#3FB950" stroke-width="1.5"/>
  <text x="64" y="308" fill="#3FB950" font-size="12.5" font-weight="700">the audit record · DATA BRANCH DIFF</text>
  <text x="64" y="328" fill="#9DA7B3" font-size="11">DELETED 2,830 = 200 + 2,000 + 630　→ 18,170 pairs remain</text>
  <line x1="444" y1="262" x2="444" y2="284" stroke="#3FB950" stroke-width="1.6" marker-end="url(#arrG)"/>

  <!-- adjudication -->
  <rect x="44" y="362" width="390" height="96" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.4"/>
  <text x="64" y="386" fill="#E6EDF3" font-size="12.5" font-weight="700">adjudicating the 4,000 split (2:1) pairs</text>
  <text x="64" y="408" fill="#79C0FF" font-size="11">Alice branch: 985 overturned　Bob: 657</text>
  <text x="64" y="428" fill="#A371F7" font-size="10.5">MERGE alice → MERGE bob WHEN CONFLICT SKIP</text>
  <text x="64" y="447" fill="#6E7681" font-size="10">the overlap is the real conflict — surfaced, not silently overwritten</text>
  <line x1="444" y1="338" x2="240" y2="360" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- publish + rm binding -->
  <rect x="466" y="362" width="378" height="96" rx="10" fill="#161B22" stroke="#3FB950" stroke-width="1.5"/>
  <text x="486" y="386" fill="#E6EDF3" font-size="12.5" font-weight="700">release: register first, then snapshot</text>
  <text x="486" y="408" fill="#3FB950" font-size="11" font-weight="700">pref_v1 = 18,170 pairs, bit-for-bit reproducible</text>
  <text x="486" y="428" fill="#79C0FF" font-size="11">rm_v1 ← pref_v1 (reward-model lineage)</text>
  <text x="486" y="447" fill="#6E7681" font-size="10">63,000 raw votes frozen too → re-derive under a new rule</text>
  <line x1="440" y1="410" x2="462" y2="410" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="880" y="392" fill="#6E7681" font-size="11">preference data is second-order:</text>
  <text x="880" y="412" fill="#9DA7B3" font-size="10.5" font-weight="700">dataset version = votes × derivation rule</text>
  <text x="880" y="434" fill="#6E7681" font-size="11">so the votes must freeze with it.</text>

  <text x="44" y="492" fill="#6E7681" font-size="11.5">Which answer is better, where the threshold sits, how cycles are handled — your decisions. MatrixOne's Git4Data capability guarantees: votes and product in one version, every overturn on record, conflicts explicit, history reproducible.</text>
  <text x="44" y="512" fill="#6E7681" font-size="11.5">All numbers measured on MatrixOne 4.1.0 using deterministic expressions (no rand()), reproducible run to run.</text>
</svg>
