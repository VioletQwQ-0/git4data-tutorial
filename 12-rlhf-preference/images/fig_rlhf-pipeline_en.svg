<svg viewBox="0 0 1200 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#161B22" stroke-width="1"/></pattern>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#6E7681"/></marker>
    <marker id="al" markerWidth="9" markerHeight="9" refX="2" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#79C0FF"/></marker>
  </defs>
  <rect width="1200" height="440" fill="#0D1117"/><rect width="1200" height="440" fill="url(#g)"/>
  <text x="44" y="40" fill="#E6EDF3" font-size="22" font-weight="700">The eight stages of preference data, and where the Git4Data capability touches them</text>

  <g>
    <rect x="44"   y="76" width="126" height="62" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.3"/>
    <text x="107" y="100" fill="#9DA7B3" font-size="12.5" text-anchor="middle" font-weight="700">① generate</text>
    <text x="107" y="120" fill="#6E7681" font-size="10" text-anchor="middle">policy model</text>

    <rect x="186"  y="76" width="126" height="62" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.3"/>
    <text x="249" y="100" fill="#9DA7B3" font-size="12.5" text-anchor="middle" font-weight="700">② pair & assign</text>
    <text x="249" y="120" fill="#6E7681" font-size="10" text-anchor="middle">labeling platform</text>

    <rect x="328"  y="76" width="126" height="62" rx="8" fill="#161B22" stroke="#79C0FF" stroke-width="1.5"/>
    <text x="391" y="100" fill="#E6EDF3" font-size="12.5" text-anchor="middle" font-weight="700">③ annotate</text>
    <text x="391" y="120" fill="#79C0FF" font-size="10" text-anchor="middle">votes as-is, in the snapshot</text>

    <rect x="470"  y="76" width="126" height="62" rx="8" fill="#161B22" stroke="#79C0FF" stroke-width="1.5"/>
    <text x="533" y="100" fill="#E6EDF3" font-size="12.5" text-anchor="middle" font-weight="700">④ derive pairs</text>
    <text x="533" y="120" fill="#79C0FF" font-size="10" text-anchor="middle">rule in the registry</text>

    <rect x="612"  y="70" width="126" height="74" rx="8" fill="#10231A" stroke="#3FB950" stroke-width="1.8"/>
    <text x="675" y="96" fill="#E6EDF3" font-size="12.5" text-anchor="middle" font-weight="700">⑤ audit & curate</text>
    <text x="675" y="116" fill="#3FB950" font-size="10" text-anchor="middle">branch + DIFF</text>
    <text x="675" y="133" fill="#6E7681" font-size="9" text-anchor="middle">this article</text>

    <rect x="754"  y="70" width="126" height="74" rx="8" fill="#10231A" stroke="#3FB950" stroke-width="1.8"/>
    <text x="817" y="96" fill="#E6EDF3" font-size="12.5" text-anchor="middle" font-weight="700">⑥ adjudicate</text>
    <text x="817" y="116" fill="#3FB950" font-size="10" text-anchor="middle">branch + conflict / PICK</text>
    <text x="817" y="133" fill="#6E7681" font-size="9" text-anchor="middle">this article</text>

    <rect x="896"  y="76" width="126" height="62" rx="8" fill="#161B22" stroke="#A371F7" stroke-width="1.5"/>
    <text x="959" y="100" fill="#E6EDF3" font-size="12.5" text-anchor="middle" font-weight="700">⑦ release</text>
    <text x="959" y="120" fill="#A371F7" font-size="10" text-anchor="middle">snapshot + RM binding</text>

    <rect x="1038" y="76" width="118" height="62" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.3"/>
    <text x="1097" y="100" fill="#9DA7B3" font-size="12.5" text-anchor="middle" font-weight="700">⑧ train RM</text>
    <text x="1097" y="120" fill="#F0883E" font-size="10" text-anchor="middle">trace back / cross-version DIFF</text>
  </g>
  <g stroke="#6E7681" stroke-width="1.4">
    <line x1="172" y1="107" x2="184" y2="107" marker-end="url(#a)"/>
    <line x1="314" y1="107" x2="326" y2="107" marker-end="url(#a)"/>
    <line x1="456" y1="107" x2="468" y2="107" marker-end="url(#a)"/>
    <line x1="598" y1="107" x2="610" y2="107" marker-end="url(#a)"/>
    <line x1="740" y1="107" x2="752" y2="107" marker-end="url(#a)"/>
    <line x1="882" y1="107" x2="894" y2="107" marker-end="url(#a)"/>
    <line x1="1024" y1="107" x2="1036" y2="107" marker-end="url(#a)"/>
  </g>

  <path d="M1097 140 C 1097 214, 533 214, 391 152" fill="none" stroke="#79C0FF" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#al)"/>
  <text x="744" y="186" fill="#79C0FF" font-size="11.5" text-anchor="middle" font-weight="700">more labels / new derivation rule / new agreement bar → back to ③④⑤</text>

  <rect x="44" y="224" width="1112" height="76" rx="10" fill="#0F1622" stroke="#21262D" stroke-width="1.2"/>
  <text x="60" y="246" fill="#9DA7B3" font-size="12" font-weight="700">the boundary first:</text>
  <text x="146" y="246" fill="#6E7681" font-size="11.5">① 归policy model　② 归labeling platform　⑧ 归 RL 训练框架与评估体系——这些判断 Git4Data 能力都不碰。</text>
  <text x="60" y="272" fill="#3FB950" font-size="12" font-weight="700">it handles the middle:</text>
  <text x="210" y="272" fill="#9DA7B3" font-size="11.5">how votes become a dataset, how it is audited and adjudicated, and how it freezes into a version traceable from the reward model.</text>
  <text x="60" y="292" fill="#6E7681" font-size="11">Preference data needs all three at once: relational queries (cycles / degenerate pairs / bias) + row-level version semantics (who overturned what) + conflict semantics (two reviewers disagreed).</text>

  <text x="44" y="338" fill="#E6EDF3" font-size="13" font-weight="700">From here the article focuses on ③ → ⑦: from 63,000 votes all the way to 18,170 pairs, released and bound to rm_v1.</text>
  <text x="44" y="364" fill="#6E7681" font-size="11.5">The crux is ③: store only the final (chosen, rejected) and lose the votes, and you can never re-derive — so the votes must freeze with the product.</text>
  <text x="44" y="390" fill="#6E7681" font-size="11.5">Measured on MatrixOne 4.1.0 using deterministic expressions (no rand()).</text>
</svg>
