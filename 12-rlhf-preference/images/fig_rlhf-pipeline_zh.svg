<svg viewBox="0 0 1200 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#161B22" stroke-width="1"/></pattern>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#6E7681"/></marker>
    <marker id="al" markerWidth="9" markerHeight="9" refX="2" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#79C0FF"/></marker>
  </defs>
  <rect width="1200" height="440" fill="#0D1117"/><rect width="1200" height="440" fill="url(#g)"/>
  <text x="44" y="40" fill="#E6EDF3" font-size="22" font-weight="700">偏好数据的八个环节，以及 Git4Data 能力的触点</text>

  <g>
    <rect x="44"   y="76" width="126" height="62" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.3"/>
    <text x="107" y="100" fill="#9DA7B3" font-size="12.5" text-anchor="middle" font-weight="700">① 候选生成</text>
    <text x="107" y="120" fill="#6E7681" font-size="10" text-anchor="middle">策略模型</text>

    <rect x="186"  y="76" width="126" height="62" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.3"/>
    <text x="249" y="100" fill="#9DA7B3" font-size="12.5" text-anchor="middle" font-weight="700">② 配对派发</text>
    <text x="249" y="120" fill="#6E7681" font-size="10" text-anchor="middle">标注平台</text>

    <rect x="328"  y="76" width="126" height="62" rx="8" fill="#161B22" stroke="#79C0FF" stroke-width="1.5"/>
    <text x="391" y="100" fill="#E6EDF3" font-size="12.5" text-anchor="middle" font-weight="700">③ 标注投票</text>
    <text x="391" y="120" fill="#79C0FF" font-size="10" text-anchor="middle">投票原样进快照</text>

    <rect x="470"  y="76" width="126" height="62" rx="8" fill="#161B22" stroke="#79C0FF" stroke-width="1.5"/>
    <text x="533" y="100" fill="#E6EDF3" font-size="12.5" text-anchor="middle" font-weight="700">④ 推导偏好对</text>
    <text x="533" y="120" fill="#79C0FF" font-size="10" text-anchor="middle">规则进注册表</text>

    <rect x="612"  y="70" width="126" height="74" rx="8" fill="#10231A" stroke="#3FB950" stroke-width="1.8"/>
    <text x="675" y="96" fill="#E6EDF3" font-size="12.5" text-anchor="middle" font-weight="700">⑤ 审计 curation</text>
    <text x="675" y="116" fill="#3FB950" font-size="10" text-anchor="middle">分支 + DIFF</text>
    <text x="675" y="133" fill="#6E7681" font-size="9" text-anchor="middle">本文重点</text>

    <rect x="754"  y="70" width="126" height="74" rx="8" fill="#10231A" stroke="#3FB950" stroke-width="1.8"/>
    <text x="817" y="96" fill="#E6EDF3" font-size="12.5" text-anchor="middle" font-weight="700">⑥ 分歧裁决</text>
    <text x="817" y="116" fill="#3FB950" font-size="10" text-anchor="middle">分支 + 冲突 / PICK</text>
    <text x="817" y="133" fill="#6E7681" font-size="9" text-anchor="middle">本文重点</text>

    <rect x="896"  y="76" width="126" height="62" rx="8" fill="#161B22" stroke="#A371F7" stroke-width="1.5"/>
    <text x="959" y="100" fill="#E6EDF3" font-size="12.5" text-anchor="middle" font-weight="700">⑦ 发布</text>
    <text x="959" y="120" fill="#A371F7" font-size="10" text-anchor="middle">快照 + RM 绑定</text>

    <rect x="1038" y="76" width="118" height="62" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.3"/>
    <text x="1097" y="100" fill="#9DA7B3" font-size="12.5" text-anchor="middle" font-weight="700">⑧ 训练 RM</text>
    <text x="1097" y="120" fill="#F0883E" font-size="10" text-anchor="middle">回溯 / 跨版本 DIFF</text>
  </g>
  <g stroke="#6E7681" stroke-width="1.4">
    <line x1="172" y1="107" x2="184" y2="107" marker-end="url(#a)"/>
    <line x1="314" y1="107" x2="326" y2="107" marker-end="url(#a)"/>
    <line x1="456" y1="107" x2="468" y2="107" marker-end="url(#a)"/>
    <line x1="598" y1="107" x2="610" y2="107" marker-end="url(#a)"/>
    <line x1="740" y1="107" x2="752" y2="107" marker-end="url(#a)"/>
    <line x1="882" y1="107" x2="894" y2="107" marker-end="url(#a)"/>
    <line x1="1024" y1="107" x2="1036" y2="107" marker-end="url(#a)"/>
  </g>

  <path d="M1097 140 C 1097 214, 533 214, 391 152" fill="none" stroke="#79C0FF" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#al)"/>
  <text x="744" y="186" fill="#79C0FF" font-size="11.5" text-anchor="middle" font-weight="700">补标注 / 调推导规则 / 换一致率门槛 → 回到 ③④⑤ 再来一轮</text>

  <rect x="44" y="224" width="1112" height="76" rx="10" fill="#0F1622" stroke="#21262D" stroke-width="1.2"/>
  <text x="60" y="246" fill="#9DA7B3" font-size="12" font-weight="700">先划清地盘：</text>
  <text x="150" y="246" fill="#6E7681" font-size="11.5">① 归策略模型　② 归标注平台　⑧ 归 RL 训练框架与评估体系——这些判断 Git4Data 能力都不碰。</text>
  <text x="60" y="272" fill="#3FB950" font-size="12" font-weight="700">它管的是中间那段：</text>
  <text x="196" y="272" fill="#9DA7B3" font-size="11.5">投票怎么变成数据集、数据集怎么被审计和裁决、怎么被冻成一个能追溯到奖励模型的版本。</text>
  <text x="60" y="292" fill="#6E7681" font-size="11">偏好数据同时需要：关系型查询（查环 / 退化对 / 偏置）＋ 行级版本语义（谁改判了哪些行）＋ 冲突语义（两个评审判得不一样）。</text>

  <text x="44" y="338" fill="#E6EDF3" font-size="13" font-weight="700">本文接下来聚焦 ③→⑦ 这一整段：从 63,000 条投票，一路走到 18,170 对、并绑定 rm_v1 的发布版本。</text>
  <text x="44" y="364" fill="#6E7681" font-size="11.5">关键在 ③：只存最终的 (chosen, rejected)、把投票丢了，就再也没法换规则重算——所以投票必须和成品一起冻住。</text>
  <text x="44" y="390" fill="#6E7681" font-size="11.5">数据实测于 MatrixOne 4.1.0，使用确定性表达式（无 rand()）。</text>
</svg>
