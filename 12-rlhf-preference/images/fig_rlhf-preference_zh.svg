<svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#161B22" stroke-width="1"/></pattern>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#6E7681"/></marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#F85149"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#3FB950"/></marker>
    <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#A371F7"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#0D1117"/><rect width="1200" height="520" fill="url(#g)"/>
  <text x="44" y="40" fill="#E6EDF3" font-size="22" font-weight="700">偏好数据：投票「算」出成品，再审计、裁决、绑定奖励模型</text>

  <!-- votes -> derive -> pairs -->
  <rect x="44" y="74" width="150" height="76" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.4"/>
  <text x="119" y="100" fill="#E6EDF3" font-size="12.5" text-anchor="middle" font-weight="700">原始投票</text>
  <text x="119" y="121" fill="#79C0FF" font-size="12" text-anchor="middle" font-weight="700">63,000 条</text>
  <text x="119" y="139" fill="#6E7681" font-size="10" text-anchor="middle">3 标注员 / pair</text>

  <line x1="196" y1="112" x2="242" y2="112" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="219" y="103" fill="#9DA7B3" font-size="9.5" text-anchor="middle">多数票</text>

  <rect x="246" y="74" width="150" height="76" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.4"/>
  <text x="321" y="100" fill="#E6EDF3" font-size="12.5" text-anchor="middle" font-weight="700">偏好对</text>
  <text x="321" y="121" fill="#79C0FF" font-size="12" text-anchor="middle" font-weight="700">21,000 对</text>
  <text x="321" y="139" fill="#6E7681" font-size="10" text-anchor="middle">chosen / rejected</text>

  <text x="440" y="96" fill="#A371F7" font-size="11" font-weight="700">一致率分布</text>
  <text x="440" y="115" fill="#9DA7B3" font-size="10.5">1.000 → 15,000　0.667 → 4,000</text>
  <text x="440" y="133" fill="#9DA7B3" font-size="10.5">0.333 → 2,000（三人三答，等于没结论）</text>

  <!-- cycle illustration -->
  <g transform="translate(880,60)">
    <text x="110" y="20" fill="#F85149" font-size="12" text-anchor="middle" font-weight="700">偏好环：逻辑上不可能</text>
    <circle cx="60"  cy="52" r="16" fill="#161B22" stroke="#30363D"/><text x="60"  y="57" fill="#E6EDF3" font-size="12" text-anchor="middle">A</text>
    <circle cx="160" cy="52" r="16" fill="#161B22" stroke="#30363D"/><text x="160" y="57" fill="#E6EDF3" font-size="12" text-anchor="middle">B</text>
    <circle cx="110" cy="112" r="16" fill="#161B22" stroke="#30363D"/><text x="110" y="117" fill="#E6EDF3" font-size="12" text-anchor="middle">C</text>
    <line x1="78"  y1="52" x2="142" y2="52"  stroke="#F85149" stroke-width="1.6" marker-end="url(#arrR)"/>
    <line x1="153" y1="66" x2="120" y2="98"  stroke="#F85149" stroke-width="1.6" marker-end="url(#arrR)"/>
    <line x1="100" y1="98" x2="67"  y2="66"  stroke="#F85149" stroke-width="1.6" marker-end="url(#arrR)"/>
    <text x="110" y="145" fill="#F85149" font-size="11" text-anchor="middle" font-weight="700">实测 630 个 pair 卷在环里</text>
  </g>

  <!-- audit band -->
  <rect x="44" y="176" width="800" height="86" rx="10" fill="#0F1622" stroke="#21262D" stroke-width="1.2"/>
  <text x="60" y="196" fill="#9DA7B3" font-size="11.5" font-weight="700">在分支上审计（主池 21,000 对全程不动）</text>
  <g font-size="11" text-anchor="middle">
    <text x="135" y="222" fill="#E6EDF3" font-weight="700">退化对</text><text x="135" y="242" fill="#F0883E" font-weight="700">删 200</text>
    <text x="300" y="222" fill="#E6EDF3" font-weight="700">无共识</text><text x="300" y="242" fill="#F0883E" font-weight="700">删 2,000</text>
    <text x="465" y="222" fill="#E6EDF3" font-weight="700">偏好环</text><text x="465" y="242" fill="#F0883E" font-weight="700">删 630</text>
    <text x="680" y="222" fill="#E6EDF3" font-weight="700">长度偏置审计</text>
    <text x="680" y="242" fill="#F85149" font-weight="700">75.9% chosen 更长（只看不删）</text>
  </g>
  <g stroke="#30363D" stroke-width="1">
    <line x1="217" y1="208" x2="217" y2="252"/><line x1="382" y1="208" x2="382" y2="252"/><line x1="560" y1="208" x2="560" y2="252"/>
  </g>
  <line x1="321" y1="150" x2="321" y2="174" stroke="#A371F7" stroke-width="1.6" marker-end="url(#arrP)"/>

  <!-- receipt -->
  <rect x="44" y="286" width="800" height="52" rx="10" fill="#10231A" stroke="#3FB950" stroke-width="1.5"/>
  <text x="64" y="308" fill="#3FB950" font-size="12.5" font-weight="700">收据 · DATA BRANCH DIFF</text>
  <text x="64" y="328" fill="#9DA7B3" font-size="11">DELETED 2,830 = 200 + 2,000 + 630　→ 剩 18,170 对</text>
  <line x1="444" y1="262" x2="444" y2="284" stroke="#3FB950" stroke-width="1.6" marker-end="url(#arrG)"/>

  <!-- adjudication -->
  <rect x="44" y="362" width="390" height="96" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.4"/>
  <text x="64" y="386" fill="#E6EDF3" font-size="12.5" font-weight="700">分歧裁决（2:1 的 4,000 对）</text>
  <text x="64" y="408" fill="#79C0FF" font-size="11">Alice 分支改判 985　　Bob 分支改判 657</text>
  <text x="64" y="428" fill="#A371F7" font-size="11">MERGE alice → 再 MERGE bob WHEN CONFLICT SKIP</text>
  <text x="64" y="447" fill="#6E7681" font-size="10.5">重叠处＝真冲突，显式暴露，不被悄悄覆盖</text>
  <line x1="444" y1="338" x2="240" y2="360" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- publish + rm binding -->
  <rect x="466" y="362" width="378" height="96" rx="10" fill="#161B22" stroke="#3FB950" stroke-width="1.5"/>
  <text x="486" y="386" fill="#E6EDF3" font-size="12.5" font-weight="700">发布：先登记，后快照</text>
  <text x="486" y="408" fill="#3FB950" font-size="11" font-weight="700">pref_v1 = 18,170 对，可逐位复现</text>
  <text x="486" y="428" fill="#79C0FF" font-size="11">rm_v1 ← pref_v1（奖励模型血缘绑定）</text>
  <text x="486" y="447" fill="#6E7681" font-size="10.5">63,000 条原始投票同在快照里 → 可换规则重算</text>
  <line x1="440" y1="410" x2="462" y2="410" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="880" y="392" fill="#6E7681" font-size="11">偏好数据是二阶数据：</text>
  <text x="880" y="412" fill="#9DA7B3" font-size="11" font-weight="700">数据集版本 = 投票版本 × 推导规则</text>
  <text x="880" y="434" fill="#6E7681" font-size="11">所以投票必须和成品一起冻住。</text>

  <text x="44" y="492" fill="#6E7681" font-size="11.5">谁的回答更好、门槛卡多少、环怎么处理，都由你决定；Git4Data 保证的是：投票与成品同版本、每次改判可查、冲突显式、历史可复现。</text>
  <text x="44" y="512" fill="#6E7681" font-size="11.5">全部数据实测于 MatrixOne 4.1.0，且使用确定性表达式（无 rand()），可逐次复现。</text>
</svg>
