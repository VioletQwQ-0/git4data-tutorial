<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#161B22" stroke-width="1"/></pattern>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#6E7681"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#3FB950"/></marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#F85149"/></marker>
  </defs>
  <rect width="1200" height="500" fill="#0D1117"/><rect width="1200" height="500" fill="url(#g)"/>
  <text x="44" y="40" fill="#E6EDF3" font-size="22" font-weight="700">Agent 自进化：三个候选各一条分支，门禁判定，赢家合并、失控回滚</text>
  <text x="44" y="64" fill="#F0883E" font-size="12.5" font-weight="700">把 Agent 的行为变成一张表，「自我改进」就落回熟悉的老套路：提议 → 分支 → 评估 → 合并 / 丢弃 → 回滚</text>

  <rect x="44" y="88" width="170" height="72" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.4"/>
  <text x="129" y="114" fill="#E6EDF3" font-size="12.5" text-anchor="middle" font-weight="700">agent_config</text>
  <text x="129" y="134" fill="#79C0FF" font-size="11" text-anchor="middle">行为即数据（6 个配置项）</text>
  <text x="129" y="152" fill="#3FB950" font-size="10.5" text-anchor="middle">snapshot cfg_v7</text>

  <g>
    <rect x="262" y="80" width="240" height="42" rx="7" fill="#161B22" stroke="#30363D" stroke-width="1.3"/>
    <text x="278" y="106" fill="#E6EDF3" font-size="11.5" font-weight="700">cand_a</text>
    <text x="360" y="106" fill="#9DA7B3" font-size="11">top_k 5 → 10</text>
    <text x="478" y="106" fill="#6E7681" font-size="10" text-anchor="end">DIFF 1</text>

    <rect x="262" y="130" width="240" height="42" rx="7" fill="#161B22" stroke="#30363D" stroke-width="1.3"/>
    <text x="278" y="156" fill="#E6EDF3" font-size="11.5" font-weight="700">cand_b</text>
    <text x="360" y="156" fill="#9DA7B3" font-size="11">prompt v3 → v4</text>
    <text x="478" y="156" fill="#6E7681" font-size="10" text-anchor="end">DIFF 1</text>

    <rect x="262" y="180" width="240" height="42" rx="7" fill="#161B22" stroke="#30363D" stroke-width="1.3"/>
    <text x="278" y="206" fill="#E6EDF3" font-size="11.5" font-weight="700">cand_c</text>
    <text x="360" y="206" fill="#9DA7B3" font-size="11">temp+top_k</text>
    <text x="478" y="206" fill="#6E7681" font-size="10" text-anchor="end">DIFF 2</text>
  </g>
  <line x1="216" y1="124" x2="258" y2="101" stroke="#A371F7" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="216" y1="124" x2="258" y2="151" stroke="#A371F7" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="216" y1="124" x2="258" y2="201" stroke="#A371F7" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="232" y="80" fill="#A371F7" font-size="10" text-anchor="middle" font-weight="700">零拷贝分支</text>

  <rect x="540" y="80" width="616" height="142" rx="10" fill="#0F1622" stroke="#21262D" stroke-width="1.2"/>
  <text x="558" y="102" fill="#9DA7B3" font-size="11.5" font-weight="700">门禁：在同一批冻结的 2,000 条评测输入上比较</text>
  <text x="558" y="124" fill="#6E7681" font-size="10.5">规则：质量必须真的提升，且成本涨幅不超过 20%（写成数据里的规则，不留在某个人的判断里）</text>
  <g font-size="11">
    <text x="566" y="150" fill="#9DA7B3" font-weight="700">baseline</text>
    <text x="700" y="150" fill="#9DA7B3">95.00%</text><text x="800" y="150" fill="#9DA7B3">1400 tok</text>
    <text x="566" y="174" fill="#E6EDF3" font-weight="700">cand_a</text>
    <text x="700" y="174" fill="#3FB950">98.00%  (+3)</text><text x="800" y="174" fill="#3FB950">1550  (×1.107)</text>
    <text x="1000" y="174" fill="#3FB950" font-weight="700">PROMOTE</text>
    <text x="566" y="196" fill="#E6EDF3" font-weight="700">cand_b</text>
    <text x="700" y="196" fill="#9DA7B3">95.00%  (0)</text><text x="800" y="196" fill="#9DA7B3">1410  (×1.007)</text>
    <text x="1000" y="196" fill="#F85149" font-weight="700">REJECT</text>
    <text x="566" y="216" fill="#E6EDF3" font-weight="700">cand_c</text>
    <text x="700" y="216" fill="#9DA7B3">99.00%  (+4)</text><text x="800" y="216" fill="#F85149" font-weight="700">2200  (×1.571)</text>
    <text x="1000" y="216" fill="#F85149" font-weight="700">REJECT</text>
  </g>

  <rect x="44" y="256" width="540" height="86" rx="10" fill="#10231A" stroke="#3FB950" stroke-width="1.5"/>
  <text x="64" y="280" fill="#3FB950" font-size="12.5" font-weight="700">晋升赢家，丢弃输家</text>
  <text x="64" y="302" fill="#9DA7B3" font-size="11">MERGE cfg_cand_a  ·  DROP cfg_cand_b  ·  DROP cfg_cand_c</text>
  <text x="64" y="324" fill="#6E7681" font-size="10.5">丢弃成本为零（分支零拷贝）→ 试错越便宜，Agent 越敢多提方案。DIFF vs cfg_v7 = UPDATED 1</text>
  <line x1="848" y1="222" x2="500" y2="252" stroke="#3FB950" stroke-width="1.5" marker-end="url(#ag)"/>

  <rect x="616" y="256" width="540" height="86" rx="10" fill="#161B22" stroke="#F85149" stroke-width="1.4"/>
  <text x="636" y="280" fill="#F85149" font-size="12.5" font-weight="700">线上不认账：自动优化失控</text>
  <text x="636" y="302" fill="#9DA7B3" font-size="11">评测里很好，线上顶穿 SLA；优化器继续加码 → top_k = 999</text>
  <text x="636" y="324" fill="#3FB950" font-size="11.5" font-weight="700">RESTORE DATABASE … {SNAPSHOT = cfg_v7}   →   top_k = 5 / human</text>
  <line x1="588" y1="298" x2="612" y2="298" stroke="#F85149" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="44" y="368" width="1112" height="56" rx="10" fill="#0F1622" stroke="#21262D" stroke-width="1.2"/>
  <text x="64" y="390" fill="#A371F7" font-size="12" font-weight="700">十五篇下来，其实一直是同样四个问题：</text>
  <text x="64" y="412" fill="#9DA7B3" font-size="11.5">snapshot（现在是哪一版） · diff（差什么） · branch（先试不碰主线） · merge / restore（搞砸能退回）</text>

  <text x="44" y="456" fill="#6E7681" font-size="11.5">cand_c 质量最高（99%）却被拒——因为成本涨 57%。没有成本这一维，它就会被选中，然后账单翻倍且无人说得清原因。</text>
  <text x="44" y="478" fill="#6E7681" font-size="11.5">回滚点必须由人确认；能改自己的系统，必须配一个它改不动的退路。数据实测于 MatrixOne 4.1.0。</text>
</svg>