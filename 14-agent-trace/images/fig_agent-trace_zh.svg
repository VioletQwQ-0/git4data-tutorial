<svg viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#161B22" stroke-width="1"/></pattern>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#F0883E"/></marker>
  </defs>
  <rect width="1200" height="470" fill="#0D1117"/><rect width="1200" height="470" fill="url(#g)"/>
  <text x="44" y="40" fill="#E6EDF3" font-size="22" font-weight="700">Agent 轨迹：光有日志查不出原因，钉住依赖才能归因</text>
  <text x="44" y="64" fill="#F0883E" font-size="12.5" font-weight="700">轨迹是 append-only 日志，不需要 diff / merge——要版本化的是它依赖的东西</text>

  <rect x="44" y="88" width="520" height="66" rx="10" fill="#0F1622" stroke="#21262D" stroke-width="1.2"/>
  <text x="62" y="110" fill="#9DA7B3" font-size="11.5" font-weight="700">地基：把比较的前提钉住</text>
  <text x="62" y="132" fill="#A371F7" font-size="11">CREATE SNAPSHOT evalset_v1 …    CREATE SNAPSHOT mem_r1 …</text>
  <text x="62" y="149" fill="#6E7681" font-size="10">评测集冻住 → 比较才公平；记忆冻住 → 事后才还原得出「它当时知道什么」</text>

  <rect x="596" y="88" width="560" height="66" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.4"/>
  <text x="614" y="110" fill="#E6EDF3" font-size="12" font-weight="700">总体：v1 vs v2（同一批 2,000 条输入）</text>
  <text x="614" y="132" fill="#9DA7B3" font-size="11.5">v1   ok 97.5%   ·   1345 tok   ·   1100 ms</text>
  <text x="614" y="150" fill="#F85149" font-size="11.5" font-weight="700">v2   ok 72.5%   ·   1645 tok   ·   1300 ms    ← 掉 25 个点</text>

  <text x="44" y="192" fill="#9DA7B3" font-size="12.5" font-weight="700">三条 SQL 的归因链：</text>
  <g>
    <rect x="44"  y="204" width="250" height="60" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.4"/>
    <text x="169" y="228" fill="#E6EDF3" font-size="12" text-anchor="middle" font-weight="700">成功率下降</text>
    <text x="169" y="250" fill="#F0883E" font-size="12" text-anchor="middle" font-weight="700">−25 个点</text>

    <rect x="330" y="204" width="250" height="60" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.4"/>
    <text x="455" y="228" fill="#E6EDF3" font-size="12" text-anchor="middle" font-weight="700">回归的输入数</text>
    <text x="455" y="250" fill="#F0883E" font-size="12" text-anchor="middle" font-weight="700">500</text>

    <rect x="616" y="204" width="250" height="60" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.4"/>
    <text x="741" y="228" fill="#E6EDF3" font-size="12" text-anchor="middle" font-weight="700">集中在哪一类</text>
    <text x="741" y="250" fill="#F0883E" font-size="12" text-anchor="middle" font-weight="700">technical 500 / 500</text>

    <rect x="902" y="204" width="254" height="60" rx="8" fill="#10231A" stroke="#3FB950" stroke-width="1.5"/>
    <text x="1029" y="228" fill="#E6EDF3" font-size="12" text-anchor="middle" font-weight="700">是哪个工具坏了</text>
    <text x="1029" y="250" fill="#F85149" font-size="12" text-anchor="middle" font-weight="700">search_kb 2.5% → 27.5%</text>
  </g>
  <g stroke="#F0883E" stroke-width="1.6">
    <line x1="296" y1="234" x2="326" y2="234" marker-end="url(#ao)"/>
    <line x1="582" y1="234" x2="612" y2="234" marker-end="url(#ao)"/>
    <line x1="868" y1="234" x2="898" y2="234" marker-end="url(#ao)"/>
  </g>
  <text x="600" y="288" fill="#6E7681" font-size="11" text-anchor="middle">从「线上变差了」到「v2 的新检索路径让 search_kb 在技术类问题上挂了」——不需要人翻日志</text>

  <rect x="44" y="308" width="1112" height="80" rx="10" fill="#161B22" stroke="#A371F7" stroke-width="1.4"/>
  <text x="64" y="332" fill="#A371F7" font-size="12.5" font-weight="700">第四条 SQL：还原「它当时知道什么」</text>
  <text x="64" y="354" fill="#9DA7B3" font-size="11.5">runs.memory_snapshot = mem_r1   →   JOIN agent_memory {SNAPSHOT=mem_r1}   →   run 100001 当时读到 plan_tier = basic</text>
  <text x="64" y="376" fill="#6E7681" font-size="11">轨迹说明发生了什么，被钉住的记忆版本说明它基于什么——两者合起来才回答「为什么」</text>

  <text x="44" y="422" fill="#6E7681" font-size="11.5">这一篇里没有一条 DATA BRANCH MERGE，这是有意的：日志就该是日志，写完不改。</text>
  <text x="44" y="444" fill="#6E7681" font-size="11.5">数据实测于 MatrixOne 4.1.0，使用确定性表达式（无 rand()）。</text>
</svg>