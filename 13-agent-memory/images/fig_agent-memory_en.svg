<svg viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#161B22" stroke-width="1"/></pattern>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#6E7681"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#3FB950"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#F85149"/></marker>
  </defs>
  <rect width="1200" height="470" fill="#0D1117"/><rect width="1200" height="470" fill="url(#g)"/>
  <text x="44" y="40" fill="#E6EDF3" font-size="22" font-weight="700">Agent memory: writes go to a branch, merge after audit, roll back the store on incident</text>
  <text x="44" y="64" fill="#F0883E" font-size="12.5" font-weight="700">What's different from every earlier part: the agent writes the data itself, and it takes effect instantly</text>

  <rect x="44" y="88" width="158" height="74" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.4"/>
  <text x="123" y="114" fill="#E6EDF3" font-size="12.5" text-anchor="middle" font-weight="700">memory store (main)</text>
  <text x="123" y="135" fill="#79C0FF" font-size="12" text-anchor="middle" font-weight="700">40,000 facts</text>
  <text x="123" y="152" fill="#6E7681" font-size="10" text-anchor="middle">never moves a row</text>

  <line x1="204" y1="125" x2="250" y2="125" stroke="#A371F7" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="227" y="116" fill="#A371F7" font-size="9.5" text-anchor="middle">branch</text>

  <rect x="254" y="88" width="176" height="74" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.4"/>
  <text x="342" y="112" fill="#E6EDF3" font-size="12.5" text-anchor="middle" font-weight="700">session run_9001 proposes</text>
  <text x="342" y="133" fill="#79C0FF" font-size="12" text-anchor="middle" font-weight="700">3,000 new memories</text>
  <text x="342" y="152" fill="#6E7681" font-size="10" text-anchor="middle">DIFF: INSERTED 3000</text>

  <rect x="454" y="80" width="454" height="90" rx="10" fill="#0F1622" stroke="#21262D" stroke-width="1.2"/>
  <text x="470" y="100" fill="#9DA7B3" font-size="11.5" font-weight="700">audit: three problems, three treatments</text>
  <text x="522" y="126" fill="#E6EDF3" font-size="11" text-anchor="middle" font-weight="700">contradiction</text>
  <text x="522" y="145" fill="#F0883E" font-size="11" text-anchor="middle" font-weight="700">300</text>
  <text x="522" y="161" fill="#3FB950" font-size="9.5" text-anchor="middle">mark superseded</text>
  <text x="672" y="126" fill="#E6EDF3" font-size="11" text-anchor="middle" font-weight="700">low confidence</text>
  <text x="672" y="145" fill="#F0883E" font-size="11" text-anchor="middle" font-weight="700">428</text>
  <text x="672" y="161" fill="#F85149" font-size="9.5" text-anchor="middle">reject</text>
  <text x="822" y="126" fill="#E6EDF3" font-size="11" text-anchor="middle" font-weight="700">untraceable</text>
  <text x="822" y="145" fill="#F0883E" font-size="11" text-anchor="middle" font-weight="700">120</text>
  <text x="822" y="161" fill="#F85149" font-size="9.5" text-anchor="middle">reject</text>
  <g stroke="#30363D" stroke-width="1"><line x1="597" y1="112" x2="597" y2="164"/><line x1="747" y1="112" x2="747" y2="164"/></g>
  <line x1="432" y1="125" x2="452" y2="125" stroke="#6E7681" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="44" y="196" width="864" height="52" rx="10" fill="#10231A" stroke="#3FB950" stroke-width="1.5"/>
  <text x="64" y="218" fill="#3FB950" font-size="12.5" font-weight="700">the receipt after merge · DATA BRANCH DIFF</text>
  <text x="64" y="238" fill="#9DA7B3" font-size="11">INSERTED 2,469 (531 rejected) / UPDATED 206 (old facts superseded)　→ store 40,000 → 42,469</text>
  <line x1="476" y1="170" x2="476" y2="194" stroke="#3FB950" stroke-width="1.6" marker-end="url(#ag)"/>

  <rect x="44" y="276" width="430" height="104" rx="10" fill="#161B22" stroke="#F85149" stroke-width="1.4"/>
  <text x="64" y="300" fill="#F85149" font-size="12.5" font-weight="700">what the audit can't stop: run_9002 corrupts memory</text>
  <text x="64" y="322" fill="#9DA7B3" font-size="11">DIFF vs mem_v1 → UPDATED 5,000 (5,000 poisoned)</text>
  <text x="64" y="345" fill="#3FB950" font-size="11.5" font-weight="700">RESTORE TABLE … {SNAPSHOT = mem_v1}</text>
  <text x="64" y="366" fill="#3FB950" font-size="11">→ poisoned 0, store back to 42,469</text>

  <rect x="500" y="276" width="408" height="104" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.4"/>
  <text x="520" y="300" fill="#E6EDF3" font-size="12.5" font-weight="700">provenance columns answer all four questions</text>
  <text x="520" y="322" fill="#9DA7B3" font-size="11">when → written_at　　which session → source_run</text>
  <text x="520" y="343" fill="#9DA7B3" font-size="11">what else → WHERE source_run='run_9001' → 2,469 rows</text>
  <text x="520" y="364" fill="#9DA7B3" font-size="11">undo? → sweep by source_run / RESTORE the store</text>

  <text x="44" y="412" fill="#6E7681" font-size="11.5">A contradiction doesn't delete the new fact — it marks the old one stale. People change, and only kept history explains why the agent answered that way back in March.</text>
  <text x="44" y="434" fill="#6E7681" font-size="11.5">The confidence bar and contradiction policy are yours; Git4Data guarantees writes are auditable, traceable, reversible. Measured on MatrixOne 4.1.0.</text>
</svg>
