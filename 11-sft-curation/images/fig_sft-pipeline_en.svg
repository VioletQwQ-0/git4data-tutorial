<svg viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#161B22" stroke-width="1"/></pattern>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#6E7681"/></marker>
    <marker id="al" markerWidth="9" markerHeight="9" refX="2" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#79C0FF"/></marker>
  </defs>
  <rect width="1200" height="430" fill="#0D1117"/><rect width="1200" height="430" fill="url(#g)"/>
  <text x="44" y="40" fill="#E6EDF3" font-size="22" font-weight="700">The eight stages of SFT data, and where the Git4Data capability touches them</text>

  <!-- stage boxes -->
  <g>
    <rect x="44"   y="76" width="126" height="62" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.3"/>
    <text x="107" y="102" fill="#9DA7B3" font-size="12.5" text-anchor="middle" font-weight="700">① acquire</text>
    <text x="107" y="122" fill="#6E7681" font-size="10" text-anchor="middle">bought / synthetic / human</text>

    <rect x="186"  y="76" width="126" height="62" rx="8" fill="#161B22" stroke="#79C0FF" stroke-width="1.5"/>
    <text x="249" y="102" fill="#E6EDF3" font-size="12.5" text-anchor="middle" font-weight="700">② pool</text>
    <text x="249" y="122" fill="#79C0FF" font-size="10" text-anchor="middle">branch + MERGE</text>

    <rect x="328"  y="76" width="126" height="62" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.3"/>
    <text x="391" y="102" fill="#9DA7B3" font-size="12.5" text-anchor="middle" font-weight="700">③ score</text>
    <text x="391" y="122" fill="#A371F7" font-size="10" text-anchor="middle">scores in the snapshot</text>

    <rect x="470"  y="70" width="126" height="74" rx="8" fill="#10231A" stroke="#3FB950" stroke-width="1.8"/>
    <text x="533" y="98" fill="#E6EDF3" font-size="13" text-anchor="middle" font-weight="700">④ curate</text>
    <text x="533" y="118" fill="#3FB950" font-size="10" text-anchor="middle">branch + DIFF</text>
    <text x="533" y="134" fill="#6E7681" font-size="9" text-anchor="middle">this article</text>

    <rect x="612"  y="76" width="126" height="62" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.3"/>
    <text x="675" y="102" fill="#9DA7B3" font-size="12.5" text-anchor="middle" font-weight="700">⑤ mix</text>
    <text x="675" y="122" fill="#79C0FF" font-size="10" text-anchor="middle">SQL stats + registry</text>

    <rect x="754"  y="76" width="126" height="62" rx="8" fill="#161B22" stroke="#A371F7" stroke-width="1.5"/>
    <text x="817" y="102" fill="#E6EDF3" font-size="12.5" text-anchor="middle" font-weight="700">⑥ release</text>
    <text x="817" y="122" fill="#A371F7" font-size="10" text-anchor="middle">database SNAPSHOT</text>

    <rect x="896"  y="76" width="126" height="62" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.3"/>
    <text x="959" y="102" fill="#9DA7B3" font-size="12.5" text-anchor="middle" font-weight="700">⑦ train</text>
    <text x="959" y="122" fill="#6E7681" font-size="10" text-anchor="middle">training framework</text>

    <rect x="1038" y="76" width="118" height="62" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.3"/>
    <text x="1097" y="102" fill="#9DA7B3" font-size="12.5" text-anchor="middle" font-weight="700">⑧ evaluate</text>
    <text x="1097" y="122" fill="#F0883E" font-size="10" text-anchor="middle">cross-version DIFF</text>
  </g>
  <g stroke="#6E7681" stroke-width="1.4">
    <line x1="172" y1="107" x2="184" y2="107" marker-end="url(#a)"/>
    <line x1="314" y1="107" x2="326" y2="107" marker-end="url(#a)"/>
    <line x1="456" y1="107" x2="468" y2="107" marker-end="url(#a)"/>
    <line x1="598" y1="107" x2="610" y2="107" marker-end="url(#a)"/>
    <line x1="740" y1="107" x2="752" y2="107" marker-end="url(#a)"/>
    <line x1="882" y1="107" x2="894" y2="107" marker-end="url(#a)"/>
    <line x1="1024" y1="107" x2="1036" y2="107" marker-end="url(#a)"/>
  </g>

  <!-- feedback loop -->
  <path d="M1097 140 C 1097 212, 533 212, 391 152" fill="none" stroke="#79C0FF" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#al)"/>
  <text x="740" y="184" fill="#79C0FF" font-size="11.5" text-anchor="middle" font-weight="700">add data / move the bar / rebalance → back to ③④⑤ for another round</text>

  <!-- ownership band -->
  <rect x="44" y="218" width="1112" height="74" rx="10" fill="#0F1622" stroke="#21262D" stroke-width="1.2"/>
  <text x="60" y="240" fill="#9DA7B3" font-size="12" font-weight="700">the boundary first:</text>
  <text x="146" y="240" fill="#6E7681" font-size="11.5">③ 归打分模型　⑤ 归建模策略　⑦⑧ 归training framework与评估体系——这些判断 Git4Data 能力都不碰。</text>
  <text x="60" y="266" fill="#3FB950" font-size="12" font-weight="700">it handles another layer:</text>
  <text x="196" y="266" fill="#9DA7B3" font-size="11.5">how data enters (branch), how it changes (DIFF), how it freezes into a version (snapshot), and how to undo a mistake (RESTORE).</text>
  <text x="60" y="285" fill="#6E7681" font-size="11">In one line: SQL decides whether the data is good enough; the Git4Data capability provides the isolated workspace, the version anchor, and the auditable change record.</text>

  <text x="44" y="330" fill="#E6EDF3" font-size="13" font-weight="700">本文接下来聚焦分量最重的 ④ curate，并把 ②、⑤、⑥ 串起来走一遍完整流程。</text>
  <text x="44" y="356" fill="#6E7681" font-size="11.5">④ deletes the most and is the least transparent: 73,000 → 59,671, and where those 13,329 went was, until now, something nobody could state.</text>
  <text x="44" y="382" fill="#6E7681" font-size="11.5">Measured on MatrixOne 4.1.0.</text>
</svg>
