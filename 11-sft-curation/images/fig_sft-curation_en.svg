<svg viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#161B22" stroke-width="1"/></pattern>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#6E7681"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#3FB950"/></marker>
    <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#A371F7"/></marker>
  </defs>
  <rect width="1200" height="470" fill="#0D1117"/><rect width="1200" height="470" fill="url(#g)"/>
  <text x="44" y="40" fill="#E6EDF3" font-size="22" font-weight="700">One SFT curation pass: cut on a branch, count every cut, DIFF the receipt</text>

  <!-- pool -->
  <rect x="44" y="80" width="150" height="72" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.4"/>
  <text x="119" y="108" fill="#E6EDF3" font-size="13" text-anchor="middle" font-weight="700">SFT pool</text>
  <text x="119" y="130" fill="#79C0FF" font-size="12" text-anchor="middle" font-weight="700">73,000 rows</text>
  <text x="119" y="146" fill="#6E7681" font-size="10" text-anchor="middle">main table · never moves</text>

  <!-- branch arrow -->
  <line x1="196" y1="116" x2="248" y2="116" stroke="#A371F7" stroke-width="1.8" marker-end="url(#arrP)"/>
  <text x="222" y="106" fill="#A371F7" font-size="10" text-anchor="middle" font-weight="700">zero-copy</text>

  <!-- six cuts -->
  <rect x="252" y="72" width="700" height="88" rx="10" fill="#0F1622" stroke="#21262D" stroke-width="1.2"/>
  <text x="268" y="92" fill="#9DA7B3" font-size="11.5" font-weight="700">six cuts on the branch (one SQL each: count first, then delete)</text>
  <g font-size="10.5" text-anchor="middle">
    <text x="322" y="120" fill="#E6EDF3" font-weight="700">exact dup</text><text x="322" y="140" fill="#F0883E" font-size="11" font-weight="700">4,000</text>
    <text x="428" y="120" fill="#E6EDF3" font-weight="700">near dup</text><text x="428" y="140" fill="#F0883E" font-size="11" font-weight="700">3,000</text>
    <text x="534" y="120" fill="#E6EDF3" font-weight="700">quality</text><text x="534" y="140" fill="#F0883E" font-size="11" font-weight="700">5,184</text>
    <text x="640" y="120" fill="#E6EDF3" font-weight="700">safety</text><text x="640" y="140" fill="#F0883E" font-size="11" font-weight="700">101</text>
    <text x="752" y="120" fill="#E6EDF3" font-weight="700">decontam</text><text x="752" y="140" fill="#F0883E" font-size="11" font-weight="700">744</text>
    <text x="880" y="120" fill="#E6EDF3" font-weight="700">conv integrity</text><text x="880" y="140" fill="#F0883E" font-size="11" font-weight="700">300</text>
  </g>
  <g stroke="#30363D" stroke-width="1">
    <line x1="375" y1="104" x2="375" y2="150"/><line x1="481" y1="104" x2="481" y2="150"/>
    <line x1="587" y1="104" x2="587" y2="150"/><line x1="693" y1="104" x2="693" y2="150"/>
    <line x1="815" y1="104" x2="815" y2="150"/>
  </g>
  <text x="1075" y="112" fill="#6E7681" font-size="10.5" text-anchor="middle">order matters: integrity</text>
  <text x="1075" y="128" fill="#6E7681" font-size="10.5" text-anchor="middle">check comes last</text>

  <!-- receipt -->
  <rect x="252" y="196" width="700" height="62" rx="10" fill="#10231A" stroke="#3FB950" stroke-width="1.5"/>
  <text x="272" y="222" fill="#3FB950" font-size="13" font-weight="700">the receipt · DATA BRANCH DIFF</text>
  <text x="272" y="244" fill="#9DA7B3" font-size="11">DELETED 13,329  =  4,000 + 3,000 + 5,184 + 101 + 744 + 300  ← the pool is still 73,000, untouched</text>
  <line x1="602" y1="160" x2="602" y2="194" stroke="#3FB950" stroke-width="1.6" marker-end="url(#arrG)"/>

  <!-- publish -->
  <rect x="252" y="292" width="340" height="86" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.4"/>
  <text x="272" y="316" fill="#E6EDF3" font-size="13" font-weight="700">release (order can't flip)</text>
  <text x="272" y="338" fill="#79C0FF" font-size="10.5">① register first (incl. curate_rule)</text>
  <text x="272" y="356" fill="#A371F7" font-size="10.5">② then CREATE SNAPSHOT, freezing the db</text>
  <line x1="602" y1="258" x2="602" y2="290" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="628" y="292" width="324" height="86" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.4"/>
  <text x="648" y="316" fill="#E6EDF3" font-size="13" font-weight="700">result</text>
  <text x="648" y="338" fill="#3FB950" font-size="11" font-weight="700">sft_v1 = 59,671 rows, bit-for-bit reproducible</text>
  <text x="648" y="356" fill="#6E7681" font-size="10.5">next round: bar 0.35→0.50, DIFF cuts 12,514 more</text>
  <line x1="596" y1="335" x2="624" y2="335" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="44" y="424" fill="#6E7681" font-size="11.5">Where the quality score comes from, where the bar sits, how the mix is set — all your decisions. Git4Data guarantees they act on a definite version, every cut is auditable, and mistakes roll back.</text>
  <text x="44" y="446" fill="#6E7681" font-size="11.5">Numbers measured on MatrixOne 4.1.0.</text>
</svg>
