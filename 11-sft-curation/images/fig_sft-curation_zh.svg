<svg viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#161B22" stroke-width="1"/></pattern>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#6E7681"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#3FB950"/></marker>
    <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#A371F7"/></marker>
  </defs>
  <rect width="1200" height="470" fill="#0D1117"/><rect width="1200" height="470" fill="url(#g)"/>
  <text x="44" y="40" fill="#E6EDF3" font-size="22" font-weight="700">一次 SFT data curation：在分支上下刀，每刀有数，DIFF 出收据</text>

  <!-- pool -->
  <rect x="44" y="80" width="150" height="72" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.4"/>
  <text x="119" y="108" fill="#E6EDF3" font-size="13" text-anchor="middle" font-weight="700">SFT 数据池</text>
  <text x="119" y="130" fill="#79C0FF" font-size="12" text-anchor="middle" font-weight="700">73,000 行</text>
  <text x="119" y="146" fill="#6E7681" font-size="10" text-anchor="middle">主表 · 全程不动</text>

  <!-- branch arrow -->
  <line x1="196" y1="116" x2="248" y2="116" stroke="#A371F7" stroke-width="1.8" marker-end="url(#arrP)"/>
  <text x="222" y="106" fill="#A371F7" font-size="10.5" text-anchor="middle" font-weight="700">零拷贝分支</text>

  <!-- six cuts -->
  <rect x="252" y="72" width="700" height="88" rx="10" fill="#0F1622" stroke="#21262D" stroke-width="1.2"/>
  <text x="268" y="92" fill="#9DA7B3" font-size="11.5" font-weight="700">在分支上下六刀（每刀一条 SQL，先数后删）</text>
  <g font-size="11" text-anchor="middle">
    <text x="322" y="120" fill="#E6EDF3" font-weight="700">精确去重</text><text x="322" y="140" fill="#F0883E" font-weight="700">4,000</text>
    <text x="428" y="120" fill="#E6EDF3" font-weight="700">近重复</text><text x="428" y="140" fill="#F0883E" font-weight="700">3,000</text>
    <text x="534" y="120" fill="#E6EDF3" font-weight="700">质量门</text><text x="534" y="140" fill="#F0883E" font-weight="700">5,184</text>
    <text x="640" y="120" fill="#E6EDF3" font-weight="700">安全</text><text x="640" y="140" fill="#F0883E" font-weight="700">101</text>
    <text x="752" y="120" fill="#E6EDF3" font-weight="700">评测去污染</text><text x="752" y="140" fill="#F0883E" font-weight="700">744</text>
    <text x="880" y="120" fill="#E6EDF3" font-weight="700">多轮完整性</text><text x="880" y="140" fill="#F0883E" font-weight="700">300</text>
  </g>
  <g stroke="#30363D" stroke-width="1">
    <line x1="375" y1="104" x2="375" y2="150"/><line x1="481" y1="104" x2="481" y2="150"/>
    <line x1="587" y1="104" x2="587" y2="150"/><line x1="693" y1="104" x2="693" y2="150"/>
    <line x1="815" y1="104" x2="815" y2="150"/>
  </g>
  <text x="1075" y="112" fill="#6E7681" font-size="10.5" text-anchor="middle">顺序重要：完整性</text>
  <text x="1075" y="128" fill="#6E7681" font-size="10.5" text-anchor="middle">检查必须放最后</text>

  <!-- receipt -->
  <rect x="252" y="196" width="700" height="62" rx="10" fill="#10231A" stroke="#3FB950" stroke-width="1.5"/>
  <text x="272" y="222" fill="#3FB950" font-size="13" font-weight="700">收据 · DATA BRANCH DIFF</text>
  <text x="272" y="244" fill="#9DA7B3" font-size="11.5">DELETED 13,329  =  4,000 + 3,000 + 5,184 + 101 + 744 + 300  ← 主表仍是 73,000，一行未动</text>
  <line x1="602" y1="160" x2="602" y2="194" stroke="#3FB950" stroke-width="1.6" marker-end="url(#arrG)"/>

  <!-- publish -->
  <rect x="252" y="292" width="340" height="86" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.4"/>
  <text x="272" y="316" fill="#E6EDF3" font-size="13" font-weight="700">发布（顺序不能反）</text>
  <text x="272" y="338" fill="#79C0FF" font-size="11">① 先登记 registry（含 curate_rule）</text>
  <text x="272" y="356" fill="#A371F7" font-size="11">② 再 CREATE SNAPSHOT 冻结整库</text>
  <line x1="602" y1="258" x2="602" y2="290" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="628" y="292" width="324" height="86" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.4"/>
  <text x="648" y="316" fill="#E6EDF3" font-size="13" font-weight="700">发布结果</text>
  <text x="648" y="338" fill="#3FB950" font-size="11.5" font-weight="700">sft_v1 = 59,671 行，可逐位复现</text>
  <text x="648" y="356" fill="#6E7681" font-size="11">下一轮门槛 0.35→0.50，DIFF 再砍 12,514</text>
  <line x1="596" y1="335" x2="624" y2="335" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="44" y="424" fill="#6E7681" font-size="11.5">质量分从哪来、门槛卡多少、配比怎么定，都由你决定；Git4Data 保证的是：决策作用在确定版本上、每一刀可审计、做错能退回。</text>
  <text x="44" y="446" fill="#6E7681" font-size="11.5">数据实测于 MatrixOne 4.1.0。</text>
</svg>
